project_id = "yuvomeet"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "8MiB"

[storage.buckets.quarantine]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg"]

[storage.buckets.media]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg"]

[storage.buckets.exports]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["application/json"]

[auth]
enabled = true
site_url = "yuvomeet://"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.rate_limit]
sms_sent = 30
# Per IP per 5 minutes. Backs up the otp-verify lockout (S-10) for direct API callers.
token_verifications = 10

[auth.email]
# Admins only: accounts are invited, never self-registered.
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "{{ .Code }} is your Yuvomeet code. Do not share it."
max_frequency = "60s"

# Fixed OTPs for local development (S-11 limits still apply).
[auth.sms.test_otp]
919999900001 = "123456"
919999900002 = "123456"
919999900003 = "123456"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# OTP delivery goes through the send-sms Edge Function (MSG91 DLT), S-7/S-10.
[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:54321/functions/v1/send-sms"
secrets = "env(SEND_SMS_HOOK_SECRET)"

# Adds the app_role claim for admins, S-43.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token"

[edge_runtime]
enabled = true
policy = "per_worker"

[analytics]
enabled = false

[functions.send-sms]
verify_jwt = false

[functions.otp-verify]
verify_jwt = false

[functions.kyc-webhook]
verify_jwt = false

[functions.push]
verify_jwt = false
