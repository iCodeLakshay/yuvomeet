project_id = "yuvomeet"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "8MiB"

[storage.buckets.quarantine]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.media]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.exports]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["application/json"]

[auth]
enabled = true
site_url = "yuvomeet://"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"

[auth.hook.send_sms]
enabled = true
uri = "pg-functions://postgres/public/send_sms_hook"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token"
